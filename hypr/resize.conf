# Enable corner-based resizing when Super is held

# Top-left corner
bind = SUPER, BTN_LEFT, exec, hyprctl dispatch resizecorner 0 0

# Top-right corner
bind = SUPER, BTN_RIGHT, exec, hyprctl dispatch resizecorner 1 0

# Bottom-right corner
bind = SUPER, BTN_RIGHT, exec, hyprctl dispatch resizecorner 1 1

# Bottom-left corner
bind = SUPER, BTN_LEFT, exec, hyprctl dispatch resizecorner 0 1

