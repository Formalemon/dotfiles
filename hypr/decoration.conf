# Decorations (blur, shadows, etc.)

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
	ignore_opacity = false
    }
    shadow {
    	enabled = true
	range = 20
	render_power = 3
	color = $highlightLow
    }
}

animations {
    enabled = true
    bezier = easeinout, 0.36, 0, 0.66, -0.56

    animation = windows, 1, 7, easeinout, slide
    animation = windowsOut, 1, 7, easeinout, slide
    animation = border, 1, 10, default
    animation = fade, 1, 10, easeinout
    animation = workspaces, 1, 6, easeinout
}

dwindle {
    pseudotile = true
    preserve_split = true
}



